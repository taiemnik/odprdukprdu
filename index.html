<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Od prdu k PRDu | Vibecoding Festival</title>
  <meta name="description" content="PRD jako mapa myšlenky. Asistent na prd pro Claude, ChatGPT a Gemini. Prezentace Vibecoding Festival Ostrava.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0a;
      --card: #141414;
      --text: #f5f5f5;
      --muted: #9ca3af;
      --lime: #d9faa7;
      --border: #2a2a2a;
      --sans: "Inter", sans-serif;
      --mono: "JetBrains Mono", monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--sans); background: var(--bg); color: var(--text); line-height: 1.6; min-height: 100vh; }
    a { color: var(--lime); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .wrap { max-width: 960px; margin: 0 auto; padding: 48px 20px 80px; }
    h1 { font-size: clamp(2.2rem, 6vw, 3.5rem); font-weight: 900; letter-spacing: -.03em; line-height: 1.05; margin-bottom: 12px; }
    h1 em { font-style: normal; color: var(--lime); }
    .event { font-size: 1.05rem; color: var(--muted); margin-bottom: 32px; }
    .event strong { color: var(--text); font-weight: 600; }
    .top-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 40px; align-items: stretch; }
    @media (max-width: 640px) { .top-row { grid-template-columns: 1fr; } }
    .qr-box, .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 28px;
      display: flex; flex-direction: column; justify-content: center;
    }
    .qr-box { flex-direction: row; flex-wrap: wrap; gap: 24px; align-items: center; }
    .qr-box img { width: 140px; height: 140px; border-radius: 8px; background: #fff; padding: 8px; flex-shrink: 0; }
    .qr-label { font-family: var(--mono); font-size: 13px; color: var(--muted); }
    .card h2 { font-size: 1.25rem; margin-bottom: 16px; }
    .btn-row { display: flex; flex-wrap: wrap; gap: 10px; }
    .btn {
      display: inline-block; font-weight: 600; font-size: .9rem;
      background: var(--lime); color: #0a0a0a; padding: 10px 18px; border-radius: 8px; text-decoration: none; border: none; cursor: pointer; font-family: inherit;
    }
    .btn:hover { text-decoration: none; filter: brightness(1.05); }
    .btn-ghost { background: transparent; color: var(--lime); border: 1px solid rgba(217,250,167,.4); }
    .section-link { font-size: 1.35rem; font-weight: 700; margin: 8px 0 0; display: inline-block; }
    .section-link:hover { text-decoration: underline; }
    footer { text-align: center; padding-top: 32px; border-top: 1px solid var(--border); color: var(--muted); font-size: .85rem; margin-top: 48px; }
    footer img { height: 36px; opacity: .9; margin-top: 16px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Od <em>prdu</em> k PRDu</h1>
    <p class="event"><strong>Josef Procházka</strong> · Vibecoding festival · Ostrava · 2. 6. 2026</p>

    <div class="top-row">
      <div class="qr-box">
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=140x140&data=https%3A%2F%2Ftaiemnik.github.io%2Fodprdukprdu%2F" alt="QR k materiálům">
        <div>
          <p class="qr-label">Naskenuj na mobilu</p>
          <p>taiemnik.github.io/odprdukprdu</p>
        </div>
      </div>
      <article class="card">
        <h2>Prezentace</h2>
        <div class="btn-row">
          <a class="btn" href="prezentace/">Otevřít slidy</a>
          <a class="btn btn-ghost" href="download/odprdukprdu-prezentace.pdf" download>Stáhnout PDF</a>
        </div>
      </article>
    </div>

    <a class="section-link" href="materialy/">Asistent na prd →</a>

    <footer>
      <p>Ambasadorství MSK · CERNA.AI</p>
      <img src="assets/supported-by-cerna-ai.svg" alt="Supported by CERNA.AI FEST">
    </footer>
  </div>
</body>
</html>
